slam_toolbox:
  ros__parameters:
    # Genel slam_toolbox online_async ayarlari. Tam parametre listesi icin:
    # https://github.com/SteveMacenski/slam_toolbox
    # NOT: use_sim_time launch'tan override edilir (hardware:false, sim:true).
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping           # mapping | localization

    resolution: 0.05
    max_laser_range: 12.0    # RPLIDAR A1M8 azami menzili ~12m
    minimum_time_interval: 0.2
    transform_timeout: 0.3
    tf_buffer_duration: 30.0

    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
