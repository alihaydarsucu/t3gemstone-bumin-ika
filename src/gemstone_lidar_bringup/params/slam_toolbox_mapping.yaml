slam_toolbox:
  ros__parameters:
    # Genel slam_toolbox online_async ayarlari. Tam parametre listesi icin:
    # https://github.com/SteveMacenski/slam_toolbox
    # NOT: use_sim_time launch uzerinden override edilir (hardware:false, sim:true).
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping           # mapping | localization

    resolution: 0.05
    max_laser_range: 12.0    # RPLIDAR A1M8 azami menzili ~12m
    minimum_time_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 60.0

    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 12.0

    # 5x hiz icin genisletilmis cerceve suresi ve buffer
    enable_interactive_mode: false
