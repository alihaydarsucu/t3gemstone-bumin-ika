ultrasonic_node:
  ros__parameters:
    # `gpiodetect`/`gpioinfo` ile dogrulandi (2026-07-30). Motor sürücüden
    # (gpiochip3) FARKLI bir chip (gpiochip2) kullaniyoruz -- ayri bir node
    # oldugu icin sorun degil, GPIO2/3/4/7-11/14/15/17 (I2C/SPI0/UART)
    # yine de kullanilmadi. Fiziksel pin numaralari standart RPi 40-pin
    # header varsayimiyla, kartin "Pin 1" isaretiyle dogrulayin.
    gpio_chip: gpiochip2
    publish_rate_hz: 10.0
    min_range: 0.02   # HC-SR04 tipik minimum menzil (m)
    max_range: 4.0    # HC-SR04 tipik maksimum menzil (m)
    field_of_view: 0.26   # ~15 derece, HC-SR04 tipik koni acisi (radyan)

    # Ultrasonik 1 -- Harezmi/Deneyap pin haritasinda trig=D0(A13), echo=D1(A12)
    ultrasonic1_trig_line: 33  # GPIO27, fiziksel pin 13
    ultrasonic1_echo_line: 36  # GPIO26, fiziksel pin 37
    ultrasonic1_frame_id: ultrasonic1_link
    ultrasonic1_topic: ultrasonic1/range

    # Ultrasonik 2 -- Harezmi/Deneyap pin haritasinda trig=D7, echo=D8
    # (opsiyonel; kullanmiyorsaniz -1 birakin, node otomatik atlar)
    ultrasonic2_trig_line: 41  # GPIO22, fiziksel pin 15
    ultrasonic2_echo_line: 42  # GPIO25, fiziksel pin 22
    ultrasonic2_frame_id: ultrasonic2_link
    ultrasonic2_topic: ultrasonic2/range
